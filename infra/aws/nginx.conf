# AI Pulse en EC2 — nginx sirve el build de Vite y proxea /api al host de functions.
server {
    listen 80 default_server;
    server_name _;

    root /opt/ai-pulse/dist;
    index index.html;

    client_max_body_size 60m;

    # Los uploads de Excel y la evaluación con LLM tardan; la llamada
    # consolidada del motor v6 puede llegar a 150s.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    # SPA de React Router: todo lo que no sea un archivo real cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
