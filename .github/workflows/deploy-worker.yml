name: Deploy Worker to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --production
        working-directory: worker

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: cd895c00-7cd4-44c0-935d-e74656934b42
          tenant-id: 497f2d6c-dcb5-4e39-b72e-3a85fbbd7812
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ai-pulse-worker
          package: worker
          scm-do-build-during-deployment: false
          enable-oryx-build: false
