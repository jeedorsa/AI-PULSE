name: Azure Static Web Apps (new sub) CI/CD

# Production deploy on push to main; temporary preview environment per PR
# (requires the SWA resource's provider property to be "GitHub" — it was
# patched from "SwaCli" on 2026-07-09, otherwise the deploy action is rejected).

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app deps
        run: npm install

      - name: Build app
        run: npm run build

      - name: Install api deps
        run: npm install --omit=optional --omit=dev
        working-directory: api

      - name: Copy SWA config to dist
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WATER_0D824A310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.static_web_app_url != ''
        run: |
          BODY="🔗 **Preview desplegado:** ${{ steps.deploy.outputs.static_web_app_url }}

          Este ambiente se actualiza con cada push al PR y se elimina al cerrarlo."
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --body "$BODY" \
            || gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$BODY"
        env:
          GH_TOKEN: ${{ github.token }}

  close_preview_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Preview Environment
    steps:
      - name: Delete preview environment
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WATER_0D824A310 }}
          action: "close"
