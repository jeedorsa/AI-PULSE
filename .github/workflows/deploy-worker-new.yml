name: Deploy Worker to new Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --production
        working-directory: worker

      - name: Deploy to Azure Functions (publish profile auth)
        uses: Azure/functions-action@v1
        with:
          app-name: ai-pulse-api
          package: worker
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_AI_PULSE_API }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
